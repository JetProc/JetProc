name: Update Merged Contributions

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README contribution list
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          README_PATH: README.md
          MAX_ITEMS: "12"
          FETCH_LIMIT: "60"
          EXCLUDED_OWNERS: JetProc,woowacourse,woowacourse-study
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: python3 .github/scripts/update_merged_contributions.py

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "No merged contribution updates."
            exit 0
          fi

          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          git commit -m "Update merged open-source contributions"
          git push
